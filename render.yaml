services:
  - type: web
    name: clara-deal-signals
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clara-deal-signals-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: BACKGROUND_WORKER
        value: "true"
      - key: LLM_MAX_TOTAL_USD
        value: "3"
      - key: SEED_DEMO
        value: "true"
databases:
  - name: clara-deal-signals-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

