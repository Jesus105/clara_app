services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clara
      POSTGRES_USER: clara
      POSTGRES_PASSWORD: clara-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clara"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clara:clara-local-only@db:5432/clara
      BACKGROUND_WORKER: "false"
      FRONTEND_DIR: /app/frontend/dist
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clara:clara-local-only@db:5432/clara
      BACKGROUND_WORKER: "false"
    depends_on:
      app:
        condition: service_started
    restart: on-failure
volumes:
  postgres_data:

